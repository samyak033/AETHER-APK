name: Build AETHER APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  P4A_PREREQUISITES_INSTALL_INTERACTIVE: "0"
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            automake libltdl-dev \
            libtool \
            pkg-config \
            build-essential \
            cmake \
            autoconf \
            autopoint \
            gettext \
            libffi-dev \
            libssl-dev \
            liblzma-dev \
            rustc \
            cargo

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer

      - name: Enable Android configuration
        run: |
          sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/#p4a.branch = master/p4a.branch = develop/' buildozer.spec

      - name: Build AETHER APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-APK
          path: bin/*.apk
          if-no-files-found: error
